<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="simple_calc — a vanilla HTML/CSS/JS calculator with keyboard support and true operator precedence.">
  <meta name="theme-color" content="#823513">
  <title>SIMPLE CALC — Hungry Tiger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
  <header class="masthead">
    <p class="eyebrow">Hungry Tiger . Simple Calculator</p>
    <h1 class="brand">SIMPLE CALC</h1>
  </header>
  <hr class="rule">
  <section class="calc" aria-label="Calculator">
    <div class="screen" role="status" aria-live="polite" aria-label="Calculator display">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
      <p class="hint">Keys · digits . + − × ÷ ( ) % · Enter · Backspace · Esc</p>
    </div>
    <div class="pad">
      <div class="aux">
        <button class="btn btn-op" type="button" data-k="lp" aria-label="Open parenthesis"><svg viewBox="0 0 24 24" role="presentation"><path d="M15 4 C11 8.5 11 15.5 15 20"></path></svg></button>
        <button class="btn btn-op" type="button" data-k="rp" aria-label="Close parenthesis"><svg viewBox="0 0 24 24" role="presentation"><path d="M9 4 C13 8.5 13 15.5 9 20"></path></svg></button>
        <button class="btn btn-op" type="button" data-k="pct" aria-label="Percent"><svg viewBox="0 0 24 24" role="presentation"><line x1="19" y1="5" x2="5" y2="19"></line><circle cx="7.6" cy="7.6" r="2.8"></circle><circle cx="16.4" cy="16.4" r="2.8"></circle></svg></button>
      </div>
      <div class="keys">
        <button class="btn btn-ac" type="button" data-k="clear" aria-label="All clear">AC</button>
        <button class="btn btn-op" type="button" data-k="back" aria-label="Backspace"><svg viewBox="0 0 24 24" role="presentation"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg></button>
        <button class="btn btn-op" type="button" data-k="negate" aria-label="Toggle sign"><svg viewBox="0 0 24 24" role="presentation"><line x1="12" y1="4" x2="12" y2="14"></line><line x1="7" y1="8.5" x2="17" y2="8.5"></line><line x1="5" y1="19" x2="19" y2="19"></line></svg></button>
        <button class="btn btn-op" type="button" data-k="op" data-v="÷" aria-label="Divide"><svg viewBox="0 0 24 24" role="presentation"><line x1="5" y1="12" x2="19" y2="12"></line><circle cx="12" cy="6.5" r="1.7" style="fill: currentColor; stroke: none;"></circle><circle cx="12" cy="17.5" r="1.7" style="fill: currentColor; stroke: none;"></circle></svg></button>

        <button class="btn btn-num" type="button" data-k="digit" data-v="7">7</button>
        <button class="btn btn-num" type="button" data-k="digit" data-v="8">8</button>
        <button class="btn btn-num" type="button" data-k="digit" data-v="9">9</button>
        <button class="btn btn-op" type="button" data-k="op" data-v="×" aria-label="Multiply"><svg viewBox="0 0 24 24" role="presentation"><line x1="5.5" y1="5.5" x2="18.5" y2="18.5"></line><line x1="18.5" y1="5.5" x2="5.5" y2="18.5"></line></svg></button>

        <button class="btn btn-num" type="button" data-k="digit" data-v="4">4</button>
        <button class="btn btn-num" type="button" data-k="digit" data-v="5">5</button>
        <button class="btn btn-num" type="button" data-k="digit" data-v="6">6</button>
        <button class="btn btn-op" type="button" data-k="op" data-v="−" aria-label="Subtract"><svg viewBox="0 0 24 24" role="presentation"><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>

        <button class="btn btn-num" type="button" data-k="digit" data-v="1">1</button>
        <button class="btn btn-num" type="button" data-k="digit" data-v="2">2</button>
        <button class="btn btn-num" type="button" data-k="digit" data-v="3">3</button>
        <button class="btn btn-op" type="button" data-k="op" data-v="+" aria-label="Add"><svg viewBox="0 0 24 24" role="presentation"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>

        <button class="btn btn-num span2" type="button" data-k="digit" data-v="0">0</button>
        <button class="btn btn-num" type="button" data-k="dot" aria-label="Decimal point">.</button>
        <button class="btn btn-op btn-eq" type="button" data-k="equals" aria-label="Equals"><svg viewBox="0 0 24 24" role="presentation"><line x1="5" y1="9" x2="19" y2="9"></line><line x1="5" y1="15" x2="19" y2="15"></line></svg></button>
      </div>
    </div>
  </section>
  <p class="colophon">Gold on rust · Built for GIP event</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
